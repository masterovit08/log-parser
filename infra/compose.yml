name: log-parser

services:
  redis:
    image: redis:8-alpine
    container_name: log-parser-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: log-parser-postgres

    environment:
      POSTGRES_USER: log-parser
      POSTGRES_PASSWORD: log-parser_dev
      POSTGRES_DB: log-parser

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/init.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U log-parser -d log-parser" ]
      interval: 3s
      timeout: 3s
      retries: 10
    
    post_start:
      - command: >
          sh -c "until pg_isready -U log-parser -d log-parser; do sleep 1; done &&
          psql -U log-parser -d log-parser -f /init.sql"

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.100.0/24

volumes:
  redis_data:
  postgres_data: