[workspace]
resolver = "2"

members = [
    "job-model",
    "log-parser",
    "worker"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
job-model = { path = "job-model" }
log-parser = { path = "log-parser" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

uuid = { version = "1.27.0", features = ["serde", "v7"] }

tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }

redis = { version = "1.7.1", features = ["tokio-comp"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "json"] }

anyhow = "1.0.104"
thiserror = "2.0.21"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
