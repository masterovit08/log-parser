name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: "parser/**"
  pull_request:
    branches: [ "main" ]
    paths: "parser/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
