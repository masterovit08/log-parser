name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parser

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Unit tests
        run: cargo test --workspace --locked

  redis-integration:
    name: Redis integration
    runs-on: ubuntu-latest

    env:
      REDIS_TEST_URL: redis://127.0.0.1:6380

    defaults:
      run:
        working-directory: parser

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Validate Docker Compose
        working-directory: .
        run: |
          docker compose -f infra/compose.yml config --quiet
          docker compose -f infra/compose.ci.yml config --quiet

      - name: Start Redis
        working-directory: .
        run: |
          docker compose -f infra/compose.ci.yml up --wait --wait-timeout 60

      - name: Run Redis integration test
        run: |
          cargo test -p worker test_redis --locked -- --ignored --nocapture

      - name: Print Redis logs on failure
        if: failure()
        working-directory: .
        run: |
          docker compose -f infra/compose.ci.yml logs --no-color redis

      - name: Stop Redis
        if: always()
        working-directory: .
        run: |
          docker compose -f infra/compose.ci.yml down -v