name: Rust

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parser

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib --bins --locked

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    env:
      REDIS_TEST_URL: redis://127.0.0.1:6380
      DATABASE_TEST_URL: postgres://log-parser:log-parser_dev@127.0.0.1:5434/log-parser

    defaults:
      run:
        working-directory: parser

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser -> target

      - name: Validate Docker Compose
        working-directory: .
        run: |
          docker compose -f infra/compose.yml config --quiet
          docker compose -f infra/compose.ci.yml config --quiet

      - name: Start Redis and Postgres
        working-directory: .
        run: |
          docker compose -f infra/compose.ci.yml up --wait --wait-timeout 60

      - name: Run integration test
        run: |
          cargo test -p worker --test integration integration_test --locked -- --ignored --nocapture

      - name: Print logs on failure
        if: failure()
        working-directory: .
        run: |
          docker compose -f infra/compose.ci.yml logs --no-color redis postgres

      - name: Stop
        if: always()
        working-directory: .
        run: |
          docker compose -f infra/compose.ci.yml down -v